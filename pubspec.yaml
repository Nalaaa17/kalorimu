name: kalorimu
description: "Kalorimu — Smart Food Journal dengan AI Vision."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.2.0+3
  fl_chart: ^0.69.0
  go_router: ^14.6.2
  flutter_riverpod: ^2.6.1
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  supabase_flutter: ^2.8.4
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.3
  intl: ^0.19.0
  connectivity_plus: ^6.1.3
  uuid: ^4.5.1
  path_provider: ^2.1.5
  percent_indicator: ^4.2.3
  google_generative_ai: ^0.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
